name: Fabric 26.3

on:
  push:
    branches: ['mc26.3/dev']
  pull_request:
    branches: ['mc26.3/dev']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew build -x runGameTest --console=plain --max-workers=2
      - run: python3 tools/verify_artifact.py
      - name: Server game tests
        # Player loading and chunk lifecycle fixtures share native server settings.
        run: ./gradlew runGameTest -PgameTestBatchSize=1 --console=plain --max-workers=2
