name: Fabric 26.3

on:
  push:
    branches: ['mc26.3/dev']
  pull_request:
    branches: ['mc26.3/dev']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --console=plain
      - run: python3 tools/verify_artifact.py
