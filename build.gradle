plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'com.simibubi.create'
version = project.mod_version
base.archivesName = 'create-fabric'

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        create {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def clientTests = providers.gradleProperty('clientTests').map { it.toBoolean() }.getOrElse(false)

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'create_test'
        enableClientGameTests = clientTests
        clearRunDirectory = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    gametestImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:4.0.34+3434d6d95d"
    gametestImplementation "net.fabricmc.fabric-api:fabric-client-gametest-api-v1:6.0.9+4be74c3f5d"

    // Standalone parser for genuine NeoForge TOML migration; no NeoForge loader.
    include(implementation("com.electronwill.night-config:core:3.8.3"))
    include(implementation("com.electronwill.night-config:toml:3.8.3"))

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

test {
    useJUnitPlatform()
}

def reuseGameTestWorld = providers.gradleProperty('reuseGameTestWorld').map { it.toBoolean() }.getOrElse(false)
def gameTestSelection = providers.gradleProperty('gameTestSelection')
def gameTestBatchSize = providers.gradleProperty('gameTestBatchSize').map { it.toInteger() }
def gameTestWorldsDirectory = layout.buildDirectory.dir('run/gameTest/test-worlds').get().asFile
tasks.withType(JavaExec).configureEach {
    if (name == 'runGameTest' && gameTestBatchSize.isPresent()) {
        def batchSize = gameTestBatchSize.get()
        if (batchSize < 1 || batchSize > 50) {
            throw new GradleException('gameTestBatchSize must be between 1 and 50.')
        }
        systemProperty 'create.test.nativeBatchSize', batchSize
    }
    if (name == 'runGameTest' && gameTestSelection.isPresent()) {
        def selection = gameTestSelection.get().trim()
        if (selection.isEmpty()) {
            throw new GradleException('gameTestSelection must name the intended tests; an empty native selection runs every test.')
        }
        systemProperty 'fabric-api.gametest.filter', selection
    }
    if (name == 'runGameTest' && !reuseGameTestWorld) {
        doFirst { task ->
            def testWorldDirectory = new File(gameTestWorldsDirectory, 'run-' + UUID.randomUUID().toString())
            if (testWorldDirectory.exists()) {
                throw new GradleException('Refusing to replace an existing GameTest universe: ' + testWorldDirectory)
            }
            task.args('--universe', testWorldDirectory.absolutePath, '--world', 'world')
            task.logger.lifecycle('Create GameTest world: {}', testWorldDirectory.absolutePath)
        }
    }
}

jar {
    from('licenses') { into 'licenses' }
    from('LICENSE')
}

